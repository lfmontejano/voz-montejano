<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente de voz · Montejano</title><style>body{background:#0b1424;color:#f7f8fb;font:16px system-ui;padding:24px;max-width:520px;margin:auto}button{background:#d6a84c;color:#121b2a;border:0;border-radius:9px;padding:14px 22px;font-weight:bold;cursor:pointer}#status{margin-top:20px;line-height:1.5}small{color:#abb9cc}</style></head><body><h2>🎙️ Accesos por voz</h2><p>Decí, por ejemplo, «Abrir ARCA de Delfino».</p><button id="start">🎙️ Escuchar</button><div id="status" role="status">Esperando instrucción.</div><p><small>Solo se transmite el texto del comando a la ventana que abrió este asistente. No se accede a la base de clientes.</small></p><script>
(function(){'use strict';const status=document.getElementById('status');const params=new URLSearchParams(location.search);const nonce=params.get('nonce');if(!nonce||!window.opener){status.textContent='Abrí esta página desde el Gestor Montejano.';document.getElementById('start').disabled=true;return;}
function send(type,data){if(!window.opener)return;window.opener.postMessage({app:'montejano-voice-v17',nonce,type,...data},'*');}
document.getElementById('start').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Este navegador no admite reconocimiento de voz. Usá Chrome actualizado.';return;}const r=new SR();r.lang='es-AR';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const text=e.results[0][0].transcript;status.textContent='Reconocido: '+text;send('result',{text});};r.onerror=e=>{status.textContent='Error: '+e.error;send('error',{error:e.error});};r.onnomatch=()=>status.textContent='No se reconoció la instrucción.';try{r.start();status.textContent='Escuchando…';}catch(e){status.textContent=e.message;}};
})();</script></body></html>
